name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Test installed package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/t" && cp -r tests "$RUNNER_TEMP/t/"
          cd "$RUNNER_TEMP/t" && HELIOS_HOME="$RUNNER_TEMP/home" python -m pytest -q tests
      - name: Run the headless example against the installed package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ex" && cp examples/*.py "$RUNNER_TEMP/ex/"
          cd "$RUNNER_TEMP/ex" && HELIOS_HOME="$RUNNER_TEMP/home" python headless_basics.py

  browser:
    # Smoke test of every view in headless Chromium, offline (tests/test_browser_smoke.py).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install ".[dev]" playwright
          python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: HELIOS_HOME="$RUNNER_TEMP/home" python -m pytest -q -rs tests/test_browser_smoke.py
