name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install ".[build,solar]"
      - name: Build
        run: python packaging/build.py
      - name: Smoke test
        shell: bash
        run: |
          exe=dist/HELIOS-L1/HELIOS-L1; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --headless --port 18765 & pid=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18765/api/status && ok=1 && break; sleep 2; done
          kill $pid || true
          [ "$ok" = 1 ]
      - uses: actions/upload-artifact@v7
        with:
          name: helios-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          # Until the public 1.0.0 release, every build is a pre-release (version 0.x)
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
      # Release policy: keep only the two newest releases. Runs only after a successful
      # publish (a failed step stops the job). Older releases are deleted without
      # --cleanup-tag, so their tags (and the compare links between them) stay; drafts are
      # left alone. The updater takes the newest release, so older ones are not needed.
      - name: Keep only the two newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq='[.[] | select(.isDraft | not)] | sort_by(.publishedAt) | reverse | .[2:] | .[].tagName'
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,publishedAt,isDraft --jq "$jq" |
          while read -r tag; do
            echo "Deleting release $tag (its tag stays)"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done
