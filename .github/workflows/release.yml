name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install ".[build]"
      - name: Build
        run: python packaging/build.py
      - name: Smoke test
        shell: bash
        run: |
          exe=dist/HELIOS-L1/HELIOS-L1; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --headless --port 18765 & pid=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18765/api/status && ok=1 && break; sleep 2; done
          kill $pid || true
          [ "$ok" = 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: helios-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
